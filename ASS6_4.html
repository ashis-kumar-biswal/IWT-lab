<html>
<head>
    <title>Counter</title>
	<script>
		var count=0;
		function decrease() {
			if(count==1) {
				doucument.write("can't be decreased");
				const p = document.getElementById("counter");
				p.value="error";
			}
			else{
				count=count-1;
				const p = document.getElementById("counter");
				p.value=count;
