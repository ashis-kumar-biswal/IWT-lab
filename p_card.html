<html>
	<head>
	<style>
	  body{
	  margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 320px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      padding: 0 0 28px 0;
    }

    .avatar-container {
      padding: 32px 0 20px;
      background: linear-gradient(135deg, #f0f4ff 0%, #e6f0ff 100%);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      object-fit: cover;
      background: #e0e0e0;
    }

    .name {
      font-size: 1.65rem;
      font-weight: 700;
      margin: 20px 0 8px;
      color: #1a1a1a;
    }

    .description {
      font-size: 1.05rem;
      color: black;
      line-height: 1.45;
      padding: 0 28px;
      margin: 0;
    }

    .contact {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 32px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1rem;
      color: #2c5282;
    }

    .contact-item a {
      color: blue;
      text-decoration: none;
      font-weight: 500;
    }

    .contact-item a:hover {
      text-decoration: underline;
      color: red;
    }	
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-container">
      <img 
        src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop&crop=faces" 
        alt="John Doe" 
        class="avatar"
      >
    </div>

    <h2 class="name">John Doe</h2>
    
    <p class="description">
      A passionate Web developer who loves building<br>interactive websites.
    </p>

    <div class="contact">
      <div class="contact-item">
        <span class="icon">?</span>
        <a href="mailto:john.doe@example.com">john.doe@example.com</a>
      </div>
      
      <div class="contact-item">
        <span class="icon">?</span>
        <a href="tel:+919876543210">+91-98765 43210</a>
      </div>
    </div>
  </div>

</body>
</html>
